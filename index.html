<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/cc7a521484.js" crossorigin="anonymous"></script>
    <title>Valentine Proposal</title>
    <link rel="icon" type="image/x-icon" href="./images/val1.jpg">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #F20B97;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        h2 {
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }
        .card {
            background: #F453AD;
            padding: 50px 100px;
            margin: 10px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
            position: relative;
        }
        img {
            width: 200px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .buttons {
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .yes { background-color: #ff4081; color: white; }
        .no { background-color: #EE73C4; color: black; }
    </style>
</head>
<body>
    <div class="card">
        <img src="./images/val3.jpg" alt="Cute Proposal">
        <h2>Will you be my <br> Val?</h2>
        <div class="buttons">
            <button class="yes" onclick="yesAction()">Yes <i class="fa-solid fa-heart-circle-check"></i></button>
            <button class="no" onclick="noAction()">No <i class="fa-solid fa-heart-circle-exclamation"></i></button>
        </div>
    </div>

    <script>
        async function yesAction() {
            let email = prompt("You have a great taste in men! Enter your email to receive a surprise gift:");
            if (email) {
                try {
                    const response = await fetch("https://valentines-steel-omega.vercel.app/", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ email })
                    });
                    const data = await response.json();
                    console.log("Server Response:", data);
                    alert("Your email has been saved! Here's your first gift");
                    window.location.href = "https://open.spotify.com/playlist/01p5PJUddVBCOrSqRZj1pl?si=aeb25175cc27461f";
                } catch (error) {
                    console.error("Error:", error);
                    alert("There was an error saving your email. Please try again.");
                }
            }
        }

        function noAction() {
            alert("Lmao Oya Na, No Yawa Boss!");
            window.location.href = "https://w7.pngwing.com/pngs/858/537/png-transparent-joggling-clown-clown-circus-clown-food-fictional-character-cartoon-thumbnail.png";
        }
    </script>
</body>
</html>
